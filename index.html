<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Basketball</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: white; }
  body { color: #131313; font-family: "Helvetica Neue", Arial, sans-serif; }
  main { position: relative; width: 100%; height: 100%; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #court { display: block; width: 100%; height: 100%; }
  .scores { position: absolute; top: max(12%, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; pointer-events: none; }
  .counter { min-width: 100px; padding: 0 18px; text-align: center; }
  .counter + .counter { border-left: 1px solid #e4e4e4; }
  .label { display: block; color: #575757; font-size: 12px; font-weight: 500; letter-spacing: .02em; }
  .value { margin-top: 5px; display: flex; align-items: baseline; justify-content: center; gap: 5px; line-height: 1; font-variant-numeric: tabular-nums; }
  .made { font-size: 24px; font-weight: 650; }
  .slash, .attempts { font-size: 15px; }
  .slash { color: #999; }
  .attempts { color: #5b5b5b; }
  #reset { position: absolute; top: calc(max(12%, env(safe-area-inset-top)) + 54px); left: 50%; transform: translateX(-50%); min-height: 44px; padding: 0 16px; border: 1px solid #dedede; border-radius: 24px; background: white; color: #222; font: 500 13px Arial, sans-serif; cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); }
</style>
</head>
<body>
<main aria-label="Basketball court" aria-describedby="directions">
  <p id="directions" class="sr">Drag sideways to move. Flick up for a near shot. For a far shot, pull down first and flick up without lifting. Double-tap the court to show Reset score.</p>
  <svg id="court" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <g id="equipment" stroke="#151515" stroke-linejoin="round" stroke-linecap="round">
      <path d="M332 -134 L353 -121 Q360 -117 360 -110 V-8 H353 V-109 Q353 -112 350 -114 L331 -125 Z" fill="#fafafa" stroke-width="2.4"/>
      <path d="M352 -12 H361 L366 -2 H347 Z" fill="#151515" stroke-width="2"/>
      <rect x="326" y="-165" width="6" height="66" rx="1.5" fill="white" stroke-width="2.8"/>
      <path d="M317 -115 H325 V-109 L317 -112" fill="#151515" stroke-width="2"/>
      <g id="net" fill="none" stroke="#393939" stroke-width="1.65"></g>
      <ellipse cx="297" cy="-115" rx="22" ry="2.8" fill="white" stroke-width="3"/>
      <path d="M19 0 H370" fill="none" stroke-width="2.7"/>
    </g>
    <g id="trail" fill="none" stroke="#626262" stroke-linecap="round" pointer-events="none"></g>
    <circle id="ball" r="11" fill="#080808"/>
  </svg>
  <section class="scores" aria-label="Score" aria-live="polite">
    <div class="counter" id="far"><span class="label">Far shots</span><div class="value"><b class="made">0</b><span class="slash">/</span><span class="attempts">0</span></div></div>
    <div class="counter" id="near"><span class="label">Near shots</span><div class="value"><b class="made">0</b><span class="slash">/</span><span class="attempts">0</span></div></div>
  </section>
  <button id="reset" type="button" hidden>Reset score</button>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const svg = $('court'), ball = $('ball'), net = $('net'), trail = $('trail');
  const field = document.querySelector('main'), reset = $('reset');
  const NS = svg.namespaceURI, rimX = 297, rimY = -115, radius = 11, gravity = 690;
  const storageKey = 'basketball-2.scores.v1';
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const blank = () => ({ near: [0, 0], far: [0, 0] });
  let scores = blank();
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (['near','far'].every(k => Array.isArray(saved?.[k]) && saved[k].length === 2 &&
        saved[k].every(n => Number.isSafeInteger(n) && n >= 0) && saved[k][0] <= saved[k][1])) scores = saved;
  } catch {}
  function showScore(save = false) {
    for (const k of ['far','near']) {
      $(k).querySelector('.made').textContent = scores[k][0];
      $(k).querySelector('.attempts').textContent = scores[k][1];
    }
    if (save) { try { localStorage.setItem(storageKey, JSON.stringify(scores)); } catch {} }
  }

  // Court coordinates are measured from the floor so resizing preserves a shot.
  let scale, left, floor, home = 94, shot = null, gesture = null, lastTap = null;
  let trace = [], netStart = -Infinity, frame = 0, previous = 0;
  function place(x, y) {
    ball.setAttribute('cx', x);
    ball.setAttribute('cy', y);
  }
  function resize() {
    const w = field.clientWidth, h = field.clientHeight;
    scale = Math.min(w / 390, h / 395, 1.75);
    left = (w - 390 * scale) / 2;
    floor = h * .75;
    const transform = 'translate(' + left + ' ' + floor + ') scale(' + scale + ')';
    for (const el of [$('equipment'), trail, ball]) el.setAttribute('transform', transform);
    gesture = lastTap = null;
  }
  // Alternating tied rows give the net open diamonds and a scalloped hem.
  function mesh() {
    const rows = [0, 7, 15, 23, 31].map((dy, j) => {
      const width = [21, 19, 16, 13.5, 12][j];
      const count = j % 2 ? 4 : 5;
      return Array.from({length: count}, (_, i) => [
        rimX + width * ((2 * i + (j % 2)) / 4 - 1), rimY + 2 + dy
      ]);
    });
    let d = '';
    const line = (a, b) => { d += 'M' + a.join(' ') + 'L' + b.join(' '); };
    for (let j = 1; j < rows.length; j++) {
      const wide = j % 2 ? rows[j-1] : rows[j], narrow = j % 2 ? rows[j] : rows[j-1];
      narrow.forEach((p, i) => { line(wide[i], p); line(wide[i+1], p); });
    }
    for (const side of [0, -1]) line(rows[0].at(side), rows[4].at(side));
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', d);
    net.append(path);
  }
  function point(e) {
    return { x: (e.clientX-left)/scale, y: (e.clientY-floor)/scale, t: e.timeStamp };
  }
  function wake() {
    if (!frame) { previous = performance.now(); frame = requestAnimationFrame(tick); }
  }
  function ink(p) {
    trace.push({...p, drawn: performance.now()});
    if (trace.length > 75) trace.shift();
    wake();
  }
  function drawTrail(now) {
    trace = trace.filter(p => now-p.drawn < 225);
    while (trail.childElementCount > Math.max(0, trace.length-1)) trail.lastChild.remove();
    for (let i=1; i<trace.length; i++) {
      const a = trace[i-1], b = trace[i];
      const line = trail.children[i-1] || trail.appendChild(document.createElementNS(NS,'path'));
      line.setAttribute('d', 'M'+a.x+' '+a.y+'L'+b.x+' '+b.y);
      line.setAttribute('stroke-width', 2.4);
      line.setAttribute('opacity', .25 * clamp(1-(now-a.drawn)/225, 0, 1));
    }
  }
  function launch(g, end) {
    const lift = g.low.y - end.y;
    const recent = g.samples.find(p => p.t >= end.t-105) || g.low;
    const speed = (recent.y-end.y) / Math.max(16, end.t-recent.t);
    if (lift < 16 || speed < .075) return;
    const distance = rimX-home, far = distance > 147, key = far ? 'far' : 'near';
    const pull = Math.max(0, g.low.y-g.start.y);
    const idealPull = clamp(distance*.32, 45, 88);
    const load = pull/idealPull;
    // A comfortable gesture has a forgiving middle band. Beyond it, range
    // increases again so a hard over-pull can carry the ball past the basket.
    const charge = load < .76 ? load/.76 : 1 + Math.max(0, load-1.45)*.65;
    const lightRange = far ? Math.min(119, distance*.72) : distance;
    const chargedRange = far ? distance-lightRange : 42;
    const minLift = far && pull > 20 ? 48 : 39;
    const maxLift = 104 + Math.min(pull, 96);
    const strength = clamp(Math.min(1, lift/minLift, speed/.28)
        + Math.max(0,lift-maxLift)/100 + Math.max(0,speed-2.8)*.11, .20, 1.85);
    const sideways = end.x-g.low.x;
    const steer = Math.sign(sideways)*Math.max(0,Math.abs(sideways)-6)*.66;
    const aimedRange = (lightRange + chargedRange*charge)*strength + steer;
    // Keep a far basket out of reach until the player draws the shot back.
    const rangeLimit = far ? lightRange + (distance-lightRange+65)*charge : Infinity;
    const range = Math.max(18,Math.min(aimedRange,rangeLimit));
    const rise = Math.max(67, (153 + Math.min(range, 280)*.16) * (.58+.42*strength));
    const vy = -Math.sqrt(2*gravity*rise);
    const descent = Math.sqrt(Math.max(0, vy*vy-2*gravity*(-radius-rimY)));
    const travel = (-vy+descent)/gravity;
    shot = { x: home, y: -radius, vx: range/travel, vy, key, made: false, groundHits: 0, age: 0 };
    scores[key][1]++;
    showScore(true);
    wake();
  }
  function rimContact(s, x) {
    const dx = s.x-x, dy = s.y-rimY, len = Math.hypot(dx,dy), min = radius+1.5;
    if (len >= min || len < .001) return;
    const nx = dx/len, ny = dy/len, approach = s.vx*nx + s.vy*ny;
    s.x = x+nx*min; s.y = rimY+ny*min;
    if (approach < 0) { s.vx -= 1.52*approach*nx; s.vy -= 1.52*approach*ny; }
  }
  function advance(dt, now) {
    const s = shot, oldY = s.y, oldX = s.x;
    s.age += dt;
    s.x += s.vx*dt;
    s.y += s.vy*dt + .5*gravity*dt*dt;
    s.vy += gravity*dt;
    if (s.y > -165-radius && s.y < -99+radius && oldX <= 326-radius && s.x > 326-radius) {
      s.x = 326-radius; s.vx = -Math.abs(s.vx)*.63;
    }
    rimContact(s,rimX-22); rimContact(s,rimX+22);
    if (!s.made && !s.groundHits && oldY < rimY && s.y >= rimY && s.vy > 0 && Math.abs(s.x-rimX) < 22-radius) {
      s.made = true; scores[s.key][0]++;
      showScore(true);
      s.vx *= .25; s.vy *= .80; netStart = now;
    }
    if (s.y >= -radius && s.vy > 0) {
      s.y = -radius; s.vy *= -.32; s.vx *= .56; s.groundHits++;
    }
    if (s.groundHits >= 2 || s.age > 3.3 || s.x > 410 || s.x < -20) {
      shot = null; place(home,-radius);
    } else place(s.x,s.y);
  }
  function tick(now) {
    frame = 0;
    let dt = Math.min(.05, (now-previous)/1000);
    previous = now;
    while (shot && dt > .000001) {
      const step = Math.min(dt,1/180); advance(step,now); dt -= step;
    }
    if (trace.length || trail.childElementCount) drawTrail(now);
    const t = (now-netStart)/1000;
    if (t < .55) {
      const stretch = 1 + .26*Math.exp(-6*t)*Math.sin(16*t);
      net.setAttribute('transform','translate(0 '+rimY+') scale(1 '+stretch+') translate(0 '+(-rimY)+')');
    } else net.removeAttribute('transform');
    if (shot || trace.length || t < .55) frame = requestAnimationFrame(tick);
  }
  field.addEventListener('pointerdown', e => {
    if (e.target === reset || !e.isPrimary || e.button !== 0 || gesture) return;
    const p = point(e);
    gesture = { id:e.pointerId, start:p, low:p, samples:[p], mode:'pending', home, busy:!!shot };
    field.setPointerCapture(e.pointerId);
    trace = [];
  });
  function sample(g,p) {
    const dx = p.x-g.start.x, dy = p.y-g.start.y;
    if (g.mode === 'pending' && Math.hypot(dx,dy) > 7) {
      g.mode = Math.abs(dx) > Math.abs(dy)*1.35 ? 'move' : 'shoot';
      reset.hidden = true; lastTap = null; ink(g.start);
    }
    if (g.mode === 'pending') return;
    ink(p);
    if (g.busy) return;
    if (g.mode === 'move') {
      home = clamp(g.home+dx,31,235); place(home,-radius);
    } else {
      if (p.y > g.low.y) { g.low = p; g.samples = []; }
      g.samples.push(p);
      g.samples = g.samples.filter(s => s.t >= p.t-140);
    }
  }
  field.addEventListener('pointermove', e => {
    if (gesture && e.pointerId === gesture.id) sample(gesture,point(e));
  });
  field.addEventListener('pointerup', e => {
    if (!gesture || gesture.id !== e.pointerId) return;
    const g = gesture, p = point(e);
    sample(g,p); gesture = null;
    if (g.mode === 'pending' && p.t-g.start.t < 240) {
      if (lastTap && p.t-lastTap.t < 310 && Math.hypot(p.x-lastTap.x,p.y-lastTap.y) < 22) {
        reset.hidden = false; lastTap = null;
      } else { lastTap = p; reset.hidden = true; }
    } else {
      lastTap = null; reset.hidden = true;
      if (g.mode === 'shoot' && !g.busy && !shot) launch(g,p);
    }
  });
  function cancel(e) {
    if (gesture?.id === e.pointerId) { gesture = lastTap = null; reset.hidden = true; }
  }
  field.addEventListener('pointercancel',cancel);
  field.addEventListener('lostpointercapture',cancel);
  reset.addEventListener('click', () => {
    shot = gesture = lastTap = null; netStart = -Infinity;
    scores = blank(); showScore(true); place(home,-radius); reset.hidden = true;
  });
  window.addEventListener('resize',resize);
  mesh(); resize(); place(home,-radius); showScore();
})();
</script>
</body>
</html>
